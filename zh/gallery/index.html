<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>作品集 | Craftsman Artifacts</title>
    <link rel="icon" href="../../images/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../style.css">
</head>
<body data-page="gallery">

    <header class="site-header">
        <nav>
            <a href="../" class="logo"><img class="logo-mark" src="../../images/logo.svg" alt="" width="36" height="36"><span>Craftsman Artifacts</span></a>
            <div class="nav-links">
                <a href="../">首页</a>
                <a href="../services/">服务</a>
                <a href="../products/">法物</a>
                <a href="../gallery/" class="active" aria-current="page">作品集</a>
                <a href="../contact/">联系我们</a>
            </div>
            <a class="lang" href="../../gallery/" lang="en" hreflang="en">English</a>
        </nav>
    </header>

    <main>
        <section class="page-head">
            <div class="wrap">
                <p class="couplet" lang="zh" aria-label="缘起缘续"><span aria-hidden="true">缘</span><span aria-hidden="true">起</span><span aria-hidden="true">缘</span><span aria-hidden="true">续</span></p>
                <div>
                    <h1>作品集</h1>
                    <p>已请回家中的法物，以及过往服务的点滴。经客户同意后分享。</p>
                </div>
            </div>
        </section>

        <div class="wrap">
            <div class="tools">
                <div class="chips" role="group" aria-label="筛选作品集">
                    <button class="chip" data-filter="all" aria-pressed="true">全部</button>
                    <button class="chip" data-filter="work" aria-pressed="false">过往服务</button>
                    <button class="chip" data-filter="homed" aria-pressed="false">已结缘法物</button>
                </div>
            </div>
            <div class="grid" id="grid"></div>
        </div>

        <dialog class="detail" id="detail" aria-labelledby="detail-title">
            <div class="detail-body">
                <img id="detail-img" src="" alt="">
                <div class="detail-text">
                    <button class="close" type="button" aria-label="关闭">&times;</button>
                    <h2 id="detail-title"></h2>
                    <p class="code" id="detail-code"></p>
                    <dl id="detail-facts"></dl>
                    <p id="detail-desc"></p>
                    <a class="btn" id="detail-btn"></a>
                </div>
            </div>
        </dialog>

    </main>

    <footer>
        <div class="wrap">
            <span>&copy; 2026 Craftsman Artifacts，新加坡</span>
            <span>回复时间 <span data-hours>上午9点至下午6点</span> · <a data-wa="您好，我经朋友介绍认识 Craftsman Artifacts，想进一步了解。">聊一聊</a></span>
        </div>
    </footer>

    <script src="../../site.js"></script>
    <script src="../../collection.js"></script>
    <script>showItems("gallery");</script>
</body>
</html>
