<!DOCTYPE html>
<html lang="zh-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>法物 | Craftsman Artifacts</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body data-page="collection">

    <header class="site-header">
        <nav>
            <a href="../" class="logo">Craftsman Artifacts</a>
            <div class="nav-links">
                <a href="../">首页</a>
                <a href="../services/">服务</a>
                <a href="../products/" class="active" aria-current="page">法物</a>
                <a href="../gallery/">作品集</a>
                <a href="../contact/">联系我们</a>
            </div>
            <a class="lang" href="../../products/" lang="en" hreflang="en">English</a>
        </nav>
    </header>

    <main>
        <section class="page-head">
            <div class="wrap">
                <p class="couplet" lang="zh" aria-label="法物结缘"><span aria-hidden="true">法</span><span aria-hidden="true">物</span><span aria-hidden="true">结</span><span aria-hidden="true">缘</span></p>
                <div>
                    <h1>我们的法物</h1>
                    <p>每件法物都因其工艺而精选，并用心开光。请回家时，师父会为其开光、送到您府上、协助安放于合适的风水位置，并在那里再次开光。</p>
                    <p>若有法物与您有缘，欢迎询问。我们会分享它的故事，帮助您判断是否适合您的空间。</p>
                </div>
            </div>
        </section>

        <div class="wrap">
            <div class="tools">
                <div class="chips" role="group" aria-label="筛选法物">
                    <button class="chip" data-filter="all" aria-pressed="true">全部</button>
                    <button class="chip" data-filter="statues" aria-pressed="false">佛像</button>
                    <button class="chip" data-filter="amulets" aria-pressed="false">护身符</button>
                    <button class="chip" data-filter="fengshui" aria-pressed="false">风水摆件</button>
                </div>
                <input class="search" type="search" id="search" placeholder="按名称或编号搜索" aria-label="按名称或编号搜索">
            </div>
            <div class="grid" id="grid"></div>
        </div>

        <dialog class="detail" id="detail" aria-labelledby="detail-title">
            <div class="detail-body">
                <img id="detail-img" src="" alt="">
                <div class="detail-text">
                    <button class="close" type="button" aria-label="关闭">&times;</button>
                    <h2 id="detail-title"></h2>
                    <p class="code" id="detail-code"></p>
                    <dl id="detail-facts"></dl>
                    <p id="detail-desc"></p>
                    <a class="btn" id="detail-btn"></a>
                </div>
            </div>
        </dialog>

    </main>

    <footer>
        <div class="wrap">
            <span>&copy; 2026 Craftsman Artifacts，新加坡</span>
            <span>回复时间 <span data-hours>上午9点至下午6点</span> · <a data-wa="您好，我经朋友介绍认识 Craftsman Artifacts，想进一步了解。">聊一聊</a></span>
        </div>
    </footer>

    <script src="../../site.js"></script>
    <script src="../../collection.js"></script>
    <script>showItems("collection");</script>
</body>
</html>
