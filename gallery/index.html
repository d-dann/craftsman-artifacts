<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>Gallery | Craftsman Artifacts</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body data-page="gallery">

    <header class="site-header">
        <nav>
            <a href="../" class="logo">Craftsman Artifacts <span class="cn">匠心法物</span></a>
            <div class="nav-links">
                <a href="../">Home</a>
                <a href="../services/">Services</a>
                <a href="../products/">Collection</a>
                <a href="../gallery/" class="active" aria-current="page">Gallery</a>
                <a href="../contact/">Contact</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-head">
            <div class="wrap">
                <p class="couplet" lang="zh" aria-label="缘起缘续"><span aria-hidden="true">缘</span><span aria-hidden="true">起</span><span aria-hidden="true">缘</span><span aria-hidden="true">续</span></p>
                <div>
                    <h1>Gallery</h1>
                    <p>Pieces that have found their home, and moments from past work. Shared with our clients' permission.</p>
                </div>
            </div>
        </section>

        <div class="wrap">
            <div class="tools">
                <div class="chips" role="group" aria-label="Filter gallery">
                    <button class="chip" data-filter="all" aria-pressed="true">Everything</button>
                    <button class="chip" data-filter="work" aria-pressed="false">Our work</button>
                    <button class="chip" data-filter="homed" aria-pressed="false">Pieces now in homes</button>
                </div>
            </div>
            <div class="grid" id="grid"></div>
        </div>

        <dialog class="detail" id="detail" aria-labelledby="detail-title">
            <div class="detail-body">
                <img id="detail-img" src="" alt="">
                <div class="detail-text">
                    <button class="close" type="button" aria-label="Close">&times;</button>
                    <h2 id="detail-title"></h2>
                    <p class="code" id="detail-code"></p>
                    <dl id="detail-facts"></dl>
                    <p id="detail-desc"></p>
                    <a class="btn" id="detail-btn"></a>
                </div>
            </div>
        </dialog>

    </main>

    <footer>
        <div class="wrap">
            <span>&copy; 2026 Craftsman Artifacts, Singapore</span>
            <span>Replies <span data-hours>9am – 6pm</span> · <a data-wa="Hi, I was referred to Craftsman Artifacts and would like to find out more.">Have a chat</a></span>
        </div>
    </footer>

    <script src="../site.js"></script>
    <script src="../collection.js"></script>
    <script>showItems("gallery");</script>
</body>
</html>
